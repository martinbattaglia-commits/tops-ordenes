name: WhatsApp · Drenaje de la cola inbound (cada 10 min)

# LINK-WA WA-8R9 CLOSEOUT · §4.D — el disparador operativo del consumidor M-4.
#
# ─── POR QUÉ ────────────────────────────────────────────────────────────────
#
# El webhook responde HTTP 200 a Meta aunque la proyección no se complete: un
# 5xx haría que Meta reintente en bucle por un problema que no es suyo. A cambio
# el evento queda `processed = false` en `wa_inbound_events`.
#
# WA-8R9 construyó el consumidor y su endpoint autenticado, pero sin un
# disparador la cola no tiene quien la lea: el evento sigue sin perderse, y
# sigue sin procesarse. Este workflow cierra ese hueco.
#
# ⚠️ INERTE POR DISEÑO EN ESTA RAMA. Los schedules de GitHub Actions sólo corren
# desde la DEFAULT BRANCH. Este archivo no ejecuta nada hasta que Dirección lo
# lleve a `main` —push/merge autorizado aparte— o lo dispare a mano. Se entrega
# como el gate de deploy que el mandato contempla, no como una activación.
#
# Secrets requeridos (los mismos que usan los workflows ya existentes; NO se
# configura ninguno acá ni se incorpora valor real alguno):
#   - CRON_SECRET : mismo valor que la env var CRON_SECRET del entorno.
#   - APP_URL     : (opcional) base URL del deploy.
#
# El endpoint es fail-closed: 503 sin secreto configurado, 401 con Bearer
# inválido. Es idempotente y procesa en lotes acotados con lease y backoff, así
# que una corrida solapada o repetida no duplica trabajo.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Tamaño del lote (1-100)"
        required: false
        default: "25"

permissions:
  contents: read

# Una sola corrida por vez: el lease de la cola ya lo tolera, pero solapar
# corridas sólo agrega ruido sin drenar más rápido.
concurrency:
  group: wa-inbound-queue-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drenar la cola de eventos inbound
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL || 'https://tops-ordenes.netlify.app' }}
          LIMIT: ${{ github.event.inputs.limit || '25' }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET no está configurado. El endpoint es fail-closed y respondería 503."
            exit 1
          fi

          # La respuesta trae SÓLO contadores y códigos saneados: nunca payloads,
          # teléfonos ni texto de terceros. Se puede volcar al log sin riesgo.
          codigo=$(curl -sS -o /tmp/respuesta.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/whatsapp/inbound-queue?limit=${LIMIT}")

          echo "HTTP ${codigo}"
          cat /tmp/respuesta.json
          echo

          if [ "${codigo}" != "200" ]; then
            echo "::error::el drenaje falló con HTTP ${codigo}"
            exit 1
          fi

          # `terminal > 0` no es una falla de la corrida: son eventos que
          # requieren replay manual y quedan contabilizados y visibles.
          terminal=$(node -e 'const r=require("/tmp/respuesta.json");console.log(r.terminal??0)')
          if [ "${terminal}" != "0" ]; then
            echo "::warning::${terminal} evento(s) en estado terminal — requieren replay manual."
          fi
